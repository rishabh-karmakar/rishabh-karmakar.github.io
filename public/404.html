<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Lost in space | Rishabh Karmakar</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #05060a;
        color: #dfe3ea;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background-image:
          radial-gradient(1px 1px at 12% 22%, #dfe3ea 50%, transparent 51%),
          radial-gradient(1px 1px at 78% 14%, #dfe3ea 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 64% 71%, #ffb224 50%, transparent 51%),
          radial-gradient(1px 1px at 31% 83%, #dfe3ea 50%, transparent 51%),
          radial-gradient(1px 1px at 91% 58%, #54a2ff 50%, transparent 51%),
          radial-gradient(1px 1px at 46% 39%, #ff5e8c 50%, transparent 51%);
      }
      main {
        max-width: 34rem;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #ffb224;
      }
      h1 {
        margin: 12px 0 14px;
        font-size: clamp(2.4rem, 9vw, 4.4rem);
        line-height: 0.95;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.01em;
      }
      h1 em {
        font-style: normal;
        color: #ffb224;
      }
      p {
        margin: 0 0 26px;
        color: #99a0ab;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 14px 22px;
        background: #ffb224;
        color: #05060a;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #dfe3ea;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404 &middot; signal lost</p>
      <h1>Nothing at these <em>coordinates.</em></h1>
      <p>The page you were looking for is not here. Everything on this site lives on one page, so the way back is short.</p>
      <a href="/">Back to the stars &rarr;</a>
    </main>
  </body>
</html>
